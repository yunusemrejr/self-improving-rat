# Self Improving Rat - default configuration.
# Format: key = value, one per line. Lines starting with '#' are comments.
# Every key below has a safe built-in default, so this file may be partially
# edited or even removed without breaking startup. Invalid keys and values
# are logged and ignored. All values are clamped to safe ranges on load.

# --- Window and rendering -----------------------------------------------
window_width              = 960
window_height             = 640
maze_width                = 13
maze_height               = 9
tile_size                 = 24
render_frames_per_second  = 30
debug_display             = false

# --- Simulation ----------------------------------------------------------
sim_steps_per_second      = 12
maze_braid_probability    = 0.40   # extra corridors opened after generation
maze_regenerate_every_cheeses = 6  # new maze every N cheese collections
min_cheese_distance       = 3      # manhattan distance rat <-> new cheese
sensory_radius            = 20     # cheese scent range in cells (covers the maze)
revisit_window_steps      = 4      # recent cells that count as oscillation

# --- Rewards (fixed, see README for the exact function) ------------------
reward_cheese             = 10.0
reward_wall_hit           = -0.2
reward_step               = -0.02
reward_revisit            = -0.05

# --- Learning ------------------------------------------------------------
nn_hidden                 = 32     # unused legacy knob; kept for compatibility
rnn_hidden                = 16     # GRU working-memory size
observation_frames        = 1      # stacked observations (input = 30 * frames)
learning_rate             = 0.0003
discount_factor           = 0.95
target_update_tau         = 0.02   # soft target-network update
exploration_start         = 0.9
exploration_end           = 0.05
exploration_decay_steps   = 50000  # linear decay over this many sim steps
replay_capacity           = 4096
batch_size                = 16
train_interval_steps      = 2
gradient_clip_norm        = 1.0

# --- Organism: homeostasis -----------------------------------------------
# All internal variables live in [0,1] and are updated by deterministic rules
# driven by real simulation events (see organism/homeostasis.h).
energy_cost_step          = 0.0004   # base metabolism per step
energy_cost_move          = 0.0008   # extra cost per successful move
energy_cheese_gain        = 0.35     # cheese restores energy
hunger_rate               = 0.0003   # hunger grows over time
hunger_cheese_reduction   = 0.5      # cheese reduces hunger
fatigue_per_move          = 0.0006
fatigue_recovery_rest     = 0.004    # per consolidation step
fatigue_recovery_idle     = 0.0002   # per step without movement
stress_wall_hit           = 0.04
stress_repeat_bonus       = 0.03     # extra stress for repeated wall hits
stress_success_relief     = 0.002    # successful navigation calms
stress_cheese_relief      = 0.2
stress_recovery_rate      = 0.0005   # passive decay toward 0
curiosity_need_rate       = 0.0002   # novelty need grows with time
curiosity_need_reduce     = 0.02     # per unit of novelty experienced
satisfaction_cheese       = 0.4
satisfaction_reversion    = 0.001    # mean reversion toward 0.5

# --- Organism: composite reward composition ------------------------------
homeo_reward_energy       = 0.002
homeo_reward_hunger       = 0.004
homeo_reward_fatigue      = 0.002
homeo_reward_stress       = 0.004
homeo_reward_satisfaction = 0.001
curiosity_reward_gain     = 0.02     # capped intrinsic reward for novelty
prediction_reward_gain    = 0.01     # bonus for low prediction uncertainty
collapse_penalty          = 0.01     # anti-collapse penalty (contextual)
scent_proximity_reward_gain = 0.08   # dense shaping: reward being near the cheese
                                      # (from the rat's own scent perception)

# --- Organism: prediction / curiosity ------------------------------------
prediction_loss_weight    = 0.3      # world-model loss relative to policy loss
prediction_ema_decay      = 0.95     # uncertainty EMA decay per training step
novelty_state_weight      = 0.5      # novelty blend: state vs prediction error
novelty_pred_weight       = 0.5
novelty_table_capacity    = 1024     # bounded novelty hash table

# --- Organism: episodic memory -------------------------------------------
episodic_memory_capacity  = 256      # bounded significant-experience store

# --- Organism: lifelong development --------------------------------------
maturity_steps            = 200000   # normalized age reaches 1.0 here
lr_age_scale              = 0.5      # learning rate: 1 - scale*age (floor 0.1)
epsilon_age_scale         = 0.3      # exploration: (1 - scale*age) factor
plasticity_age_scale      = 0.7      # structural change rate factor

# --- Organism: consolidation ---------------------------------------------
consolidation_every_cheeses     = 4   # consolidate after N cheeses
consolidation_min_interval_steps = 2000
consolidation_max_steps         = 120  # resting ticks per consolidation
consolidation_max_train_ops     = 60   # bounded training batches per cycle
consolidation_fatigue_threshold = 0.9  # or when fatigue reaches this

# --- Organism: structural plasticity -------------------------------------
plasticity_max_active_fraction        = 0.6   # hard cap on active connections
plasticity_rewire_per_consolidation   = 24    # prune/reactivate budget
plasticity_utility_decay              = 0.999 # utility trace EMA decay
plasticity_dormant_threshold_fraction = 0.05  # prune below median * this
plasticity_strengthen_factor          = 0.02
plasticity_eval_passes                = 32    # bounded post-change evaluation

# --- Persistence and logging --------------------------------------------
autosave_interval_seconds = 15
checkpoint_dir            = data/checkpoints
log_file                  = data/logs/rat.log
log_max_bytes             = 524288   # rotate when larger (keep at most 2 files)

# --- Resource limits -----------------------------------------------------
max_catchup_steps_per_frame = 8     # cap on sim steps between two frames

# --- Randomness -----------------------------------------------------------
# 0 = fresh non-deterministic seed at every startup.
# Non-zero = reproducible runs (maze, cheese and exploration sequence).
# SIR_SEED env var overrides this value.
seed                      = 0
